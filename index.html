const cnt=(k,l,v)=>`<div class="cnt"><span style="min-width:80px">${l}</span>${btn('c','−','',k+'|-.5')}<b>${fq(v)}</b>${btn('c','+','',k+'|.5')}</div>`;
function picker(){
 if(P.st==='search')return`<h2>Quel médicament ?</h2><input id="q" placeholder="Tapez le nom sur l’ordonnance" value="${esc(P.q)}" data-i="q"><div id="res">${res()}</div>${btn('pno','Annuler','')}`;
 if(P.st==='brand'){const g=DB[P.g];return`<h2>Lequel la pharmacie vous a-t-elle donné ?</h2><small>Regardez le nom sur la boîte.</small>${g.n.map((n,i)=>btn('nm',esc(n),'left',i)).join('')}${btn('dci','Je ne sais pas : '+g.g,'left')}${btn('back','← Retour','')}`}
 return`<h2>${esc(P.name)}</h2><div class="row">${btn('ty','Régulier',!P.prn?'p':'','0')}${btn('ty','Si besoin',P.prn?'p':'','1')}</div><div class="k">Forme</div><div class="row">${UN.map(u=>btn('un',u,(P.u||'comprimé')===u?'p':'',u)).join('')}</div>`+(P.prn?`${cnt('n','Comprimés',P.n)}<div class="k">Si quel symptôme ?</div><div class="row">${S.symptoms.map(s=>btn('sym',esc(s),P.sym===s?'p':'',esc(s))).join('')}</div><div class="row"><input id="ns" placeholder="Autre symptôme">${btn('nsym','Ajouter','')}</div>`:SK.map(k=>cnt(k,IC[k]+' '+SL[k],P.q3[k])).join(''))+`<div class="k">Pendant combien de temps ?</div><div class="row">${[3,5,7,10,14,21,30,60,90].map(n=>btn('dur',n===30?'1 mois':n===60?'2 mois':n===90?'3 mois':n+' j',P.dur===n?'p':'',n)).join('')}${btn('dur','Sans fin',P.dur===null?'p':'','')}</div><div class="k">Plafond ou consigne (facultatif)</div><input id="nt" placeholder="ex. maximum 3 fois par jour, 4 h entre 2 prises" data-i="nt" value="${esc(P.note||'')}" style="width:100%"><div class="row" style="margin-top:8px"><span>Début :</span><input type="date" data-d="psd" value="${P.sd||''}"></div><div class="row">${[0,1,2].map(k=>btn('sd',['Aujourd’hui','Demain','Dans 2 jours'][k],P.sd===add(today(),k)?'p':'',add(today(),k))).join('')}</div><div class="row"><span>Fin :</span><input type="date" data-d="ped" value="${P.ed||''}"></div><small>Dates à remplir seulement si elles diffèrent de l’ordonnance.</small>${btn('pok','✔ Valider ce médicament','p big')}${btn('pno','Annuler','')}`}
function add_(){
 if(P)return picker();
 if(W.step===1)return hdr('📷 Nouvelle ordonnance')+(S.profiles.length>1?`<div class="k">Pour qui ?</div><div class="row">${S.profiles.map(p=>btn('wp',esc(p.n),W.p===p.id?'p':'',p.id)).join('')}</div>`:'')+btn('scan','📷 Photographier mon ordonnance','p big')+btn('file','📁 Importer un PDF ou une image (Doctolib…)','p big')+btn('skip','Continuer sans photo','big')+btn('tab','Annuler','','home');
 if(W.step===2)return hdr('💊 Médicaments')+(W.photo?`<img src="${W.photo}" alt="Ordonnance" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">`:'')+(W.photo&&SMP?btn('read',W.reading?'⏳ Lecture en cours… (patientez)':'✨ Lire l’ordonnance automatiquement','p big'):'')+W.meds.map((x,i)=>`<section class="c ${x.chk?'warn':''}">${x.chk?'<small>⚠ À vérifier avec l’ordonnance</small><br>':''}<b>${esc(x.name)}</b><br><span class="mu">${pos({...x,start:today()})}</span><br>${btn('wed','✏ Modifier','',i)}${btn('wdel','Retirer','',i)}</section>`).join('')+btn('padd2','➕ Ajouter un médicament',W.meds.length?'big':'p big')+(W.meds.length?btn('next','Suivant →','p big'):'')+btn('tab','Annuler','','home');
 return hdr('📅 Première prise')+`<div class="t">Quand prenez-vous la première dose ?</div><div class="row">${btn('ws','Aujourd’hui',W.start===today()?'p':'',today())}${btn('ws','Demain',W.start===add(today(),1)?'p':'',add(today(),1))}</div><div class="row"><span>Autre date :</span><input type="date" data-d="ws" value="${W.start}"></div><div class="row" style="margin-top:12px"><span>Date de l’ordonnance :</span><input type="date" data-d="od" value="${W.d}"></div>${btn('save','✔ Enregistrer','p big')}${btn('back2','← Retour','')}`}
function mpick(){const L=S.ords.filter(o=>!o.man&&(S.cur==='all'||o.p===S.cur)).sort((a,b)=>b.d.localeCompare(a.d)),PR=S.profiles.filter(p=>S.cur==='all'||p.id===S.cur),mp=S.profiles.length>1;
 return hdr('➕ Ajouter un médicament')+'<div class="t">À quelle ordonnance ?</div>'+L.map(o=>btn('mto',cap(fr(o.d))+(mp?' · '+esc(pName(o.p)):''),'left',o.id)).join('')+PR.map(p=>btn('mto','✍ Sans ordonnance'+(mp?' · '+esc(p.n):''),'left','man:'+p.id)).join('')+btn('tab','Annuler','','meds')}
const TABS=[['home','🏠','Aujourd’hui'],['pil','🗓','Pilulier'],['meds','💊','Médicaments'],['ord','📄','Ordonnances'],['set','⚙','Réglages']];
function render(){
 const m={mpick,home,pil,meds:mv,ord:ords,od,set,who,add:add_,pick:()=>picker()};
 $('#app').innerHTML=m[V]();
 $('#nav').innerHTML=TABS.some(t=>t[0]===V)||V==='od'?TABS.map(t=>`<button class="${t[0]===V||(V==='od'&&t[0]==='ord')?'on':''}" data-a="tab" data-v="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join(''):''}
const newP=cb=>({st:'search',q:'',g:null,name:'',prn:false,q3:{m:1,d:0,s:1},n:1,sym:S.symptoms[0],dur:7,u:'comprimé',note:'',sd:'',ed:'',cb});
function act(a,v){
 const[p1,p2]=(v||'').split('|'),O=id=>S.ords.find(o=>o.id===id),X=(o,id)=>o.meds.find(x=>x.id===id);
 switch(a){
 case'tab':V=v;cf=null;W=null;P=null;break;
 case'who':V='who';break;
 case'sel':S.cur=v;V='home';break;
 case'take':dueOn(p1,p2).forEach(({x})=>S.logs[p1+'|'+p2+'|'+x.id]=1);toast('C’est noté ✔');break;
 case'prn':S.prn[v]=new Date().toISOString();toast('Prise enregistrée ✔');break;
 case'no':hid[v]=1;break;
 case'off':O(v).on=false;break;
 case'snz':O(v).snz=today();break;
 case'add':W={step:1,p:S.cur==='all'?S.profiles[0].id:S.cur,meds:[],d:today(),start:today(),photo:null};P=null;V='add';break;
 case'wp':W.p=v;break;
 case'scan':grab(d=>{W.photo=d;W.step=2;render()},1400);return;
 case'skip':W.step=2;break;
 case'file':grab(d=>{W.photo=d;W.step=2;render()},1400,true);return;
 case'opf':grab(d=>{O(v).photo=d;save();render()},1400,true);return;
 case'padd2':P=newP(m=>{W.meds.push(m);P=null});break;
 case'wdel':W.meds.splice(+v,1);break;
 case'madd':V='mpick';break;
 case'sd':P.sd=v;break;
 case'mto':{const man=v.startsWith('man:');let o=man?S.ords.find(o=>o.man&&o.p===v.slice(4)):O(v);P=newP(x=>{if(x.ed&&!x.sd)x.dur=Math.max(1,Math.round((new Date(x.ed)-new Date(today()))/864e5)+1);if(!o){o={id:uid(),p:v.slice(4),d:today(),on:true,man:true,meds:[]};S.ords.push(o)}o.on=true;o.meds.push(x);P=null;V='meds';toast('Médicament ajouté ✔')});V='pick';break}
 case'un':P.u=v;break;
 case'read':readOrd();return;
 case'wed':{const i=+v,x=W.meds[i];P=newP(m=>{W.meds[i]=m;P=null});Object.assign(P,{st:'pos',name:x.name,prn:x.prn,q3:{...x.q},n:x.n||1,sym:x.sym,dur:x.dur,u:x.u||'comprimé',note:x.note||'',sd:x.sd||'',ed:x.ed||''});break}
 case'next':W.step=3;break;
 case'back2':W.step=2;break;
 case'ws':W.start=v;break;
 case'save':{const o={id:uid(),p:W.p,d:W.d,photo:W.photo,on:true,meds:W.meds.map(x=>{const s=x.sd||W.start,y={...x,start:s,chk:0};if(x.ed)y.dur=Math.max(1,Math.round((new Date(x.ed)-new Date(s))/864e5)+1);return y})};S.ords.push(o);W=null;V='home';toast('Ordonnance enregistrée ✔');break}
 case'g':P.g=+v;P.st='brand';break;
 case'nm':P.name=DB[P.g].n[+v];P.st='pos';break;
 case'dci':P.name=DB[P.g].g;P.st='pos';break;
 case'oth':P.name=P.q;P.st='pos';break;
 case'back':P.st='search';break;
 case'ty':P.prn=v==='1';break;
 case'c':{const L=[0,.25,.5,.75,1,1.5,2,2.5,3,3.5,4,5,6,8],st=(c,d)=>{let i=L.findIndex(z=>z>=c-1e-9);if(i<0)i=L.length-1;return L[Math.max(0,Math.min(L.length-1,i+d))]};if(p1==='n')P.n=Math.max(.25,st(P.n,+p2>0?1:-1));else P.q3[p1]=st(P.q3[p1],+p2>0?1:-1);break}
 case'dur':P.dur=v===''?null:+v;break;
 case'sym':P.sym=v;break;
 case'nsym':{const s=$('#ns').value.trim();if(s){if(!S.symptoms.includes(s))S.symptoms.push(s);P.sym=s}break}
 case'pok':{if(!P.prn&&!SK.some(k=>P.q3[k]>0)){toast('Choisissez au moins une prise.');return}
  const x={id:uid(),name:P.name,prn:P.prn,q:{...P.q3},n:P.n,sym:P.sym,dur:P.dur,on:true,start:P.sd||today(),sd:P.sd,ed:P.ed,u:P.u,note:P.note};if(P.sd&&P.ed)x.dur=Math.max(1,Math.round((new Date(P.ed)-new Date(P.sd))/864e5)+1);const cb=P.cb;cb(x);break}
 case'pno':P=null;if(V==='pick')V='meds';break;
 case'ord':ID=p1;V='od';break;
 case'otog':O(v).on=!O(v).on;break;
 case'odel':if(cf!==v){cf=v;toast('Appuyez encore pour supprimer');break}S.ords=S.ords.filter(o=>o.id!==v);cf=null;V='ord';break;
 case'oph':grab(d=>{O(v).photo=d;save();render()},1000);return;
 case'box':grab(d=>{X(O(p1),p2).img=d;save();render()},300);return;
 case'rep':{const o=O(p1),old=X(o,p2);P=newP(nx=>{old.on=false;old.by=nx.name;o.meds.push(nx);P=null;V='meds';toast('Médicament remplacé ✔')});P.q3={...old.q};P.prn=old.prn;P.n=old.n||1;P.sym=old.sym||P.sym;P.dur=old.dur;P.u=old.u||'comprimé';P.note=old.note||'';V='pick';break}
 case'stop':X(O(p1),p2).on=false;break;
 case'start':X(O(p1),p2).on=true;break;
 case'mode':mode=v;break;
 case'wk':pm=Math.max(0,pm+ +v);break;
 case'print':mode='w';render();if(NAT())return act('share');window.print();return;
 case'share':{const st=today();let t='Mon pilulier — 7 jours\n';for(let i=0;i<7;i++){const d=add(st,i);t+='\n'+cap(fr(d))+'\n';SK.forEach(s=>{const l=dueOn(d,s).map(({x})=>fq(x.q[s])+' × '+x.name).join(', ');if(l)t+=SL[s]+' : '+l+'\n'})}try{const SH=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;if(SH)SH.share({title:'Mon pilulier',text:t});else navigator.share({text:t})}catch(e){toast('Partage indisponible')}return}
 case'padd':{const n=$('#np').value.trim();if(n)S.profiles.push({id:uid(),n});break}
 case'pdel':if(S.profiles.length<2||S.ords.some(o=>o.p===v)){toast('Impossible : profil unique ou ordonnances liées');return}S.profiles=S.profiles.filter(p=>p.id!==v);if(S.cur===v)S.cur=S.profiles[0].id;break;
 case'notif':if(NAT()){sched().then(()=>toast('Rappels programmés ✔'));return}try{Notification.requestPermission().then(r=>toast(r==='granted'?'Notifications activées':'Notifications refusées'))}catch(e){toast('Non disponible ici')}return;
 }
 save();render();sched2()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.dataset.i==='q'){P.q=e.target.value;$('#res').innerHTML=res()}else if(e.target.dataset.i==='nt')P.note=e.target.value});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.t){S.times[d.t]=e.target.value}else if(d.pn){S.profiles.find(p=>p.id===d.pn).n=e.target.value.trim()||'Profil'}else if(d.d==='ws'&&e.target.value){W.start=e.target.value}else if(d.d==='od'&&e.target.value){W.d=e.target.value}else if(d.d==='psd'){P.sd=e.target.value}else if(d.d==='ped'){P.ed=e.target.value}else return;save();if(d.d)render()});
setInterval(()=>{const n=new Date(),t=n.toTimeString().slice(0,5),k=today();for(const s of SK)if(S.times[s]===t&&S.nt!==k+s&&dueOn(k,s).some(({x})=>!S.logs[k+'|'+s+'|'+x.id])){S.nt=k+s;save();toast('⏰ C’est l’heure : '+SL[s].toLowerCase());try{new Notification('💊 Mon pilulier','C’est l’heure de la prise du '+SL[s].toLowerCase())}catch(e){}}if(V==='home')render()},20000);
let SMP=null;try{window.claude.use('sample').then(f=>{SMP=f;if(V==='add')render()}).catch(()=>{})}catch(e){}
const PROMPT=`Tu lis l’image d’une ordonnance médicale française. Extrais CHAQUE médicament ou produit prescrit (y compris crèmes, injections, bains de bouche, patchs). Si une correction manuscrite remplace un nom imprimé, utilise le nom manuscrit. Si une ligne combine un traitement régulier puis « si besoin », fais deux entrées. Ne recopie jamais le nom du patient ni son numéro de sécurité sociale. Réponds UNIQUEMENT par un tableau JSON, sans texte autour. Chaque élément : {"name": nom + dosage tel qu’écrit (ex. "Doliprane 1000 mg"), "prn": true si « si besoin / si douleurs / en cas de… », "symptom": symptôme déclencheur en un ou deux mots si prn (ex. "Douleur", "Nausées") sinon null, "m": unités le matin, "d": unités à midi, "s": unités le soir (0 si aucune ; « 3 fois par jour » ou « avant chaque repas » = 1 matin, 1 midi, 1 soir ; 0 si prn), "n": unités par prise si prn (ex. 2 pour « 2 cp »), "unit": "comprimé"|"gélule"|"sachet"|"injection"|"application"|"dose", "days": durée en jours si indiquée (1 semaine = 7, 2 semaines = 14, 1 mois = 30, 3 mois = 90) sinon null, "start": date de début AAAA-MM-JJ si indiquée sinon null, "end": date de fin AAAA-MM-JJ si indiquée sinon null, "note": consigne utile en moins de 15 mots (ex. "max 3 fois par jour, 4 h entre 2 prises") ou ""}. Fractions : 1/4 = 0.25. N’invente rien : si une information est illisible, mets null ou "".`;
async function readOrd(){
 if(!SMP||!W||!W.photo||W.reading)return;W.reading=1;render();
 try{const bin=atob(W.photo.split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const r=await SMP.json(PROMPT,{images:[new Blob([u],{type:'image/jpeg'})]}),arr=Array.isArray(r)?r:(r.meds||[]);
  arr.forEach(m=>{const q={m:+m.m||0,d:+m.d||0,s:+m.s||0},prn=!!m.prn;if(!prn&&!q.m&&!q.d&&!q.s)q.m=1;const sym=m.symptom||'Douleur';if(prn&&!S.symptoms.includes(sym))S.symptoms.push(sym);W.meds.push({id:uid(),name:String(m.name||'?'),prn,q,n:+m.n||1,sym,dur:+m.days||null,on:true,start:today(),sd:m.start||'',ed:m.end||'',u:UN.includes(m.unit)?m.unit:'comprimé',note:m.note||'',chk:1})});
  toast(arr.length+' médicament(s) lus : vérifiez chacun ⚠');
 }catch(e){toast('Lecture impossible ('+(e&&e.code||'erreur')+'). Saisissez à la main.')}
 if(W)W.reading=0;save();render()}
const NAT=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
let stt;const sched2=()=>{clearTimeout(stt);stt=setTimeout(sched,800)};
async function sched(){
 const LN=NAT()&&Capacitor.Plugins.LocalNotifications;if(!LN)return;
 try{let p=await LN.checkPermissions();if(p.display!=='granted')p=await LN.requestPermissions();if(p.display!=='granted')return;
  const pd=await LN.getPending();if(pd.notifications.length)await LN.cancel({notifications:pd.notifications});
  const out=[],now=new Date(),keep=S.cur;let id=1;S.cur='all';
  try{for(let k=0;k<14;k++){const d=add(today(),k);for(const s of SK){const at=new Date(d+'T'+S.times[s]+':00');if(at<=now)continue;
   const l=dueOn(d,s).filter(({x})=>!S.logs[d+'|'+s+'|'+x.id]);if(!l.length)continue;
   out.push({id:id++,title:IC[s]+' Mon pilulier · '+SL[s],body:l.map(({o,x})=>(S.profiles.length>1?pName(o.p)+' : ':'')+x.name+' ('+fq(x.q[s])+')').join(', '),schedule:{at,allowWhileIdle:true}})}}}finally{S.cur=keep}
  if(out.length)await LN.schedule({notifications:out})}catch(e){}}
if(NAT()){sched2();try{const AP=Capacitor.Plugins.App;AP.addListener('backButton',()=>{if(V==='home'&&!P&&!W)AP.exitApp();else{P=null;W=null;V='home';render()}})}catch(e){}}
render();
</script></body></html>
